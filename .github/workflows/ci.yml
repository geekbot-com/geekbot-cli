name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.11
    steps:
      - uses: actions/checkout@v4
      - run: bun install
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.11
    steps:
      - uses: actions/checkout@v4
      - run: bun install
      - run: bunx tsc --noEmit

  test-linux:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.11
    steps:
      - uses: actions/checkout@v4
      - run: bun install
      - name: Run unit tests (isolated to avoid mock.module leaks - bun#12823)
        run: |
          bun test tests/auth/ tests/http/ tests/output/ tests/utils/ tests/schemas/
          bun test tests/errors/error-handler.test.ts tests/errors/cli-error.test.ts tests/errors/not-found-helper.test.ts tests/errors/exit-codes.test.ts
          bun test tests/errors/error-handler-output.test.ts
          bun test tests/handlers/ tests/cli/

  test-macos:
    needs: [lint, typecheck]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Run unit tests (isolated to avoid mock.module leaks - bun#12823)
        run: |
          bun test tests/auth/ tests/http/ tests/output/ tests/utils/ tests/schemas/
          bun test tests/errors/error-handler.test.ts tests/errors/cli-error.test.ts tests/errors/not-found-helper.test.ts tests/errors/exit-codes.test.ts
          bun test tests/errors/error-handler-output.test.ts
          bun test tests/handlers/ tests/cli/

  coverage:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.11
    steps:
      - uses: actions/checkout@v4
      - run: bun install
      - name: Run tests with coverage (isolated to avoid mock.module leaks)
        run: |
          bun test --coverage tests/auth/ tests/http/ tests/output/ tests/utils/ tests/schemas/ tests/errors/error-handler.test.ts tests/errors/cli-error.test.ts tests/errors/not-found-helper.test.ts tests/errors/exit-codes.test.ts 2>&1 | tee coverage-output.txt
          bun test tests/errors/error-handler-output.test.ts
          bun test tests/handlers/ tests/cli/
      - name: Enforce 95% line coverage threshold
        run: |
          COVERAGE=$(grep 'All files' coverage-output.txt | awk -F'|' '{for(i=1;i<=NF;i++){gsub(/^ +| +$/,"",$i)}}; {print $3}')
          if [ -z "$COVERAGE" ]; then
            echo "::error::Could not parse coverage from output"
            cat coverage-output.txt
            exit 1
          fi
          echo "Line coverage: ${COVERAGE}%"
          if awk "BEGIN{exit(!(${COVERAGE} < 95))}"; then
            echo "::error::Line coverage ${COVERAGE}% is below 95% threshold"
            exit 1
          fi
          echo "Coverage threshold met: ${COVERAGE}% >= 95%"

  integration:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.11
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - run: bun install
      - name: Check integration test secret
        run: |
          if [ -z "$GEEKBOT_INTEGRATION_TEST_API_KEY" ]; then
            echo "::warning::GEEKBOT_INTEGRATION_TEST_API_KEY not set — integration tests will be skipped"
          fi
        env:
          GEEKBOT_INTEGRATION_TEST_API_KEY: ${{ secrets.GEEKBOT_INTEGRATION_TEST_API_KEY }}
      - run: bun test tests/integration/
        env:
          GEEKBOT_INTEGRATION_TEST_API_KEY: ${{ secrets.GEEKBOT_INTEGRATION_TEST_API_KEY }}
